<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MASARU เช็คชื่อ</title>

<!-- ทำให้ Safari เพิ่มลงหน้าจอโฮมเป็น "แอพ" ชื่อ+ไอคอนของเรา -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MASARU เช็คชื่อ">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#1B2D51">

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1B2D51;--navy2:#101E3A;--gold:#C9A84C;--gold-soft:#E8D9A8;--ink:#F4F6FB;--dim:#9FACC7}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Sarabun',sans-serif;color:var(--ink);min-height:100dvh;
    background:radial-gradient(120% 90% at 50% 0%, #24406F 0%, var(--navy) 45%, var(--navy2) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;gap:14px;
  }
  img.logo{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
  .brand{font-size:12px;letter-spacing:.28em;color:var(--gold);font-weight:700}
  h1{font-size:22px}
  p{font-size:14px;color:var(--dim);max-width:300px}
  .btn{
    display:block;width:min(80vw,300px);padding:15px 0;border:none;border-radius:15px;cursor:pointer;
    font-family:inherit;font-size:16.5px;font-weight:700;text-decoration:none;
    background:linear-gradient(135deg,var(--gold),#B08F35);color:#20242E;
    box-shadow:0 10px 26px rgba(0,0,0,.4);
  }
  .spin{width:40px;height:40px;border-radius:50%;border:4px solid rgba(201,168,76,.25);border-top-color:var(--gold);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .tip{
    margin-top:10px;font-size:12.5px;color:var(--dim);background:rgba(16,30,58,.6);
    border:1px solid rgba(201,168,76,.28);border-radius:14px;padding:12px 16px;max-width:320px;line-height:1.7;
  }
  .tip b{color:var(--gold-soft)}
  footer{position:fixed;bottom:14px;font-size:10.5px;color:#5D6C8C}
</style>
</head>
<body>
  <img class="logo" src="icon.png" alt="MASARU">
  <div class="brand">MASARU GROUP</div>
  <h1>ระบบเช็คชื่อพนักงาน</h1>

  <div class="spin" id="spin"></div>
  <p id="msg">กำลังเปิดแอพเช็คชื่อใน Telegram…</p>

  <a class="btn" id="openBtn" href="https://t.me/masaru_hr_bot/checkin" style="display:none">📲 เปิดแอพเช็คชื่อ</a>

  <div class="tip" id="installTip" style="display:none">
    💡 <b>ติดตั้งลงหน้าจอโฮม (ครั้งเดียว)</b><br>
    <span id="tipText"></span>
  </div>

  <footer>ฝ่ายทรัพยากรบุคคล — MASARU Group</footer>

<script>
const DEEP = 'https://t.me/masaru_hr_bot/checkin';
const isStandalone = window.navigator.standalone === true ||
                     window.matchMedia('(display-mode: standalone)').matches;
const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/i.test(ua);

function openApp(){ window.location.href = DEEP; }

if (isStandalone) {
  // เปิดจากไอคอนหน้าจอโฮม → เด้งเข้า Mini App ทันที
  openApp();
  // เผื่อเด้งไม่สำเร็จ โชว์ปุ่มสำรองใน 2 วินาที
  setTimeout(()=>{ document.getElementById('spin').style.display='none';
                   document.getElementById('msg').textContent='ถ้าแอพยังไม่เปิด กดปุ่มด้านล่าง';
                   document.getElementById('openBtn').style.display='block'; }, 2000);
} else {
  // เปิดจากเบราว์เซอร์ครั้งแรก → สอนวิธีติดตั้ง
  document.getElementById('spin').style.display='none';
  document.getElementById('msg').textContent='แตะปุ่มเพื่อเปิดแอพ หรือติดตั้งลงหน้าจอตามวิธีด้านล่าง';
  document.getElementById('openBtn').style.display='block';
  const tip = document.getElementById('installTip');
  tip.style.display='block';
  document.getElementById('tipText').innerHTML = isIOS
    ? 'เปิดหน้านี้ใน <b>Safari</b> → กดปุ่มแชร์ <b>⬆️</b> → เลื่อนหา <b>"เพิ่มลงหน้าจอโฮม"</b> → เพิ่ม<br>จากนั้นแตะไอคอน <b>MASARU เช็คชื่อ</b> ได้เลยทุกวัน'
    : 'เปิดหน้านี้ใน <b>Chrome</b> → เมนู <b>⋮</b> → <b>"เพิ่มลงในหน้าจอหลัก"</b><br>จากนั้นแตะไอคอน <b>MASARU เช็คชื่อ</b> ได้เลยทุกวัน';
}
</script>
</body>
</html>
